name: Build Penny IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/penny-ipa-20261020

permissions:
  contents: read

jobs:
  build:
    name: Archive and package for iOS devices
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh

      - name: Upload IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: Penny-unsigned
          path: build/ipa/Penny-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Penny-build-log
          path: build/ipa/build.log
          if-no-files-found: ignore
          retention-days: 14
